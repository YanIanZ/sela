name: EvidenceGuard prototype (Go)
on:
  push:
    branches:
      - feat/claude-sonnet-5-5-evidenceguard
    paths:
      - 'prototypes/evidenceguard/**'
      - '.github/workflows/evidenceguard-prototype.yml'

permissions:
  contents: write

jobs:
  go-verifier:
    name: Unit tests (mocked Claude only)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: prototypes/evidenceguard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: prototypes/evidenceguard/go.mod
          cache: false
      - name: Format Go prototype and commit
        working-directory: .
        run: |
          gofmt -w prototypes/evidenceguard/*.go
          git config user.name "YanIanZ"
          git config user.email "194694347+YanIanZ@users.noreply.github.com"
          git add prototypes/evidenceguard/*.go
          if ! git diff --cached --quiet; then
            git commit -m "style(evidenceguard): gofmt Go verifier and tests"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
      - name: Offline tests (race detector)
        run: go test -race -count=1 ./...
