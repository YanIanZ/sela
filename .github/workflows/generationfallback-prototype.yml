name: Sela DeepSeek fallback prototype
on:
  push:
    branches:
      - feat/deepseek-flash-1017-fallback
    paths:
      - 'prototypes/generationfallback/**'
      - '.github/workflows/generationfallback-prototype.yml'
  pull_request:
    paths:
      - 'prototypes/generationfallback/**'
      - '.github/workflows/generationfallback-prototype.yml'

permissions:
  contents: read

jobs:
  go-fallback:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    defaults:
      run:
        working-directory: prototypes/generationfallback
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: prototypes/generationfallback/go.mod
          cache: false
      - name: Require gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "$unformatted"
            exit 1
          fi
      - name: Run offline race-enabled unit tests
        run: go test -race -count=1 ./...
