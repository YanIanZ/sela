name: Sela research title screening

on:
  push:
    branches:
      - research/screen-7580-metadata-candidates
    paths:
      - '.github/workflows/research-screening.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  screening:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test screening logic against synthetic fixtures
        run: python3 -m unittest discover -s tests/research -p 'test_*.py'
      - name: Screen 7580 Europe PMC metadata rows
        run: |
          python3 scripts/research/screen_candidates.py \
            --input data/research/sela_research_candidates_7580.jsonl \
            --output data/research \
            --priority-limit 400
      - name: Audit outputs and source integrity
        run: |
          python3 - <<'PY'
          import csv,hashlib,json
          from pathlib import Path
          d=Path("data/research")
          m=json.loads((d/"sela_screening_manifest.json").read_text(encoding="utf-8"))
          with (d/"sela_screening_index.csv").open(encoding="utf-8",newline="") as f:
              rows=list(csv.DictReader(f))
          assert len(rows)==m["source_count"]==7580
          assert all(r["priority"] in {"high","medium","deferred"} for r in rows)
          assert len({r["candidate_id"] for r in rows})==7580
          original=d/"sela_research_candidates_7580.jsonl"
          assert hashlib.sha256(original.read_bytes()).hexdigest()==m["source_sha256"]
          selected=[json.loads(l) for l in (d/"sela_priority_review_queue.jsonl").read_text().splitlines()]
          assert len(selected)==m["queue_count"]<=400
          assert all(r["screening"]["priority"] in {"high","medium"} for r in selected)
          assert m["abstracts_used"] is False and m["full_text_used"] is False and m["llm_used"] is False
          print("Screened",len(rows),"records; prioritized",len(selected))
          PY
      - name: Commit validated metadata-screening outputs
        run: |
          git config user.name "YanIanZ"
          git config user.email "194694347+YanIanZ@users.noreply.github.com"
          git add data/research/sela_screening_index.csv \
            data/research/sela_priority_review_queue.jsonl \
            data/research/sela_screening_manifest.json
          if git diff --cached --quiet; then
            echo "Unchanged screening output"
          else
            git commit -m "data(research): publish reproducible screening index and 400 review candidates"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
