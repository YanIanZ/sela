# Sela: local Docker stack for the current v3 app.
#
#   docker compose up --build                  # app on http://localhost:8080
#   docker compose --profile web-test run --rm web-test   # typecheck + test + build
#   docker compose down                        # keep the database volume
#   docker compose down -v                     # also drop the database volume
#
# Configuration is read at runtime from the gitignored local files:
#   .env.docker-testing  app (SELA_*), including SELA_DATABASE_URL and the KEK
#   .env.pg-testing      PostgreSQL 16 credentials
# Nothing secret is baked into an image (.dockerignore excludes .env*).
#
# The app image is the single Go binary from deploy/v2/Dockerfile that serves
# web/dist plus /api/v2 and /api/v3. SELA_DB_AUTO_MIGRATE in .env.docker-testing
# applies pending migrations in development; production runs `sela migrate up`.
name: sela

services:
  postgres:
    image: postgres:16-alpine
    env_file:
      - .env.pg-testing
    # The local SELA_DATABASE_URL names this host, so the compose network keeps
    # the same alias the run-local-v3 script uses.
    networks:
      default:
        aliases:
          - sela-postgres-testing
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build:
      context: .
      dockerfile: deploy/v2/Dockerfile
      args:
        VERSION: ${SELA_VERSION:-dev}
    image: sela:v3
    ports:
      - "${SELA_PORT:-8080}:8080"
    env_file:
      - .env.docker-testing
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Frontend checks in the version CI uses (.nvmrc: 22). The whole tree is
  # mounted because two suites read repo-root fixtures; `vite build` writes
  # web/dist back to the host.
  web-test:
    profiles: ["web-test"]
    image: node:22-alpine
    working_dir: /app/web
    environment:
      CI: "true"
    volumes:
      - .:/app
      - web_node_modules:/app/web/node_modules
      - npm_cache:/root/.npm
    command: >
      sh -c "npm ci --no-audit --no-fund &&
             npm run typecheck &&
             npm test &&
             npm run build"

volumes:
  pgdata:
  web_node_modules:
  npm_cache:
